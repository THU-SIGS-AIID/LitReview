<style>
  /* Custom selection style for the PDF viewer to match the screenshot */
  .pdf-viewer-container ::selection {
    background: rgba(179, 173, 255, 0.5); /* A semi-transparent purple */
  }

  /* PDF.js text layer styles for proper positioning and interactivity */
  .textLayer {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }
  .textLayer > span {
    color: transparent;
    position: absolute;
    white-space: pre;
    cursor: text;
    transform-origin: 0% 0%;
    line-height: 1;
  }

  /* Text animation for loading spinner */
  @keyframes fadeOutDown {
    from {
      opacity: 1;
      transform: translateY(0);
    }
    to {
      opacity: 0;
      transform: translateY(20px);
    }
  }
  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-out-down {
    animation: fadeOutDown 0.5s ease-out forwards;
  }
  .animate-fade-in-down {
    animation: fadeInDown 0.5s ease-in forwards;
  }
</style>
